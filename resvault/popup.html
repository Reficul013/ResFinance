<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResVault</title>
    <link rel="stylesheet" href="/src/ui.css" />
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">ResFinance security boundary</p>
      <h1>ResVault</h1>
      <p id="status" class="status vault-status" aria-live="polite">
        <span id="status-bulb" class="status-bulb" aria-hidden="true" hidden
          >💡</span
        >
        <span id="status-text">Loading wallet state…</span>
      </p>

      <section id="setup" hidden>
        <h2>Create or import</h2>
        <label>
          Password
          <input
            id="setup-password"
            type="password"
            minlength="12"
            autocomplete="new-password"
          />
        </label>
        <label>
          Optional 64-character seed
          <input
            id="seed"
            type="password"
            inputmode="text"
            autocomplete="off"
          />
        </label>
        <p class="hint">
          Leave the seed empty to create a new wallet. It is encrypted before
          storage.
        </p>
        <button id="create" type="button">Create ResVault</button>
        <button id="import" class="secondary" type="button">Import seed</button>
      </section>

      <form id="locked" hidden>
        <h2>Unlock</h2>
        <label>
          Password
          <input
            id="unlock-password"
            type="password"
            autocomplete="current-password"
          />
        </label>
        <button id="unlock" type="submit">Unlock</button>
      </form>

      <section id="unlocked" hidden>
        <h2>Ready to approve</h2>
        <p class="identity"><span>Address</span><code id="address"></code></p>
        <p class="hint">
          Signing stays in this extension. The wallet locks after five minutes
          of inactivity.
        </p>
        <button id="lock" type="button">Lock now</button>
      </section>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
