<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approve in ResVault</title>
    <link rel="stylesheet" href="/src/ui.css" />
  </head>
  <body>
    <main class="panel approval">
      <p class="eyebrow">Explicit wallet approval</p>
      <h1>Review action</h1>
      <p id="status" class="status" aria-live="polite">Loading request…</p>
      <dl id="details" hidden>
        <div>
          <dt>Action</dt>
          <dd id="action"></dd>
        </div>
        <div>
          <dt>Origin</dt>
          <dd id="origin"></dd>
        </div>
        <div>
          <dt>Resource</dt>
          <dd id="resource"></dd>
        </div>
        <div>
          <dt>Network</dt>
          <dd id="network"></dd>
        </div>
        <div>
          <dt>Expires</dt>
          <dd id="expires"></dd>
        </div>
        <div>
          <dt>Parameters</dt>
          <dd><pre id="parameters"></pre></dd>
        </div>
      </dl>
      <div class="actions">
        <button id="reject" class="secondary" type="button">Reject</button>
        <button id="approve" type="button">Approve and sign</button>
      </div>
    </main>
    <script type="module" src="/src/approval.ts"></script>
  </body>
</html>
