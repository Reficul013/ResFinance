[project]
name = "resfinance"
version = "0.0.0"
description = "ResFinance local implementation and feasibility harness"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cryptography==50.0.2",
  "cvxpy==1.9.3",
  "fastapi==0.143.0",
  "rfc8785==0.1.4",
  "scikit-learn==1.9.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
ml = ["numpy==2.5.4", "torch==2.14.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
  "scripts/generate_openapi.py",
  "scripts/milestone0",
  "scripts/milestone1",
  "scripts/milestone2",
  "scripts/milestone3",
  "scripts/milestone5",
  "scripts/milestone6",
  "scripts/milestone7",
  "server/app",
  "ml",
  "blockchain/adapter",
  "blockchain/wallet",
]
