x-resdb-common: &resdb-common
  image: resfinance/resilientdb:4de5cb4-m1
  platform: linux/arm64
  entrypoint: ["/bin/bash", "-lc"]
  working_dir: /data
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pgrep -f '/app/bazel-bin/service/kv/kv_service' >/dev/null"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s
  depends_on:
    resdb-certs:
      condition: service_completed_successfully

services:
  resdb-certs:
    image: resfinance/resilientdb:4de5cb4-m1
    build:
      context: .
      dockerfile: infra/resilientdb/Dockerfile.milestone1
    entrypoint: ["/bin/bash", "/config/generate_dev_certificates.sh"]
    restart: "no"
    volumes:
      - ./infra/resilientdb/generate_dev_certificates.sh:/config/generate_dev_certificates.sh:ro
      - resdb-certs:/certs

  resdb-1:
    <<: *resdb-common
    command:
      - >-
        exec /app/bazel-bin/service/kv/kv_service
        /config/server.config
        /certs/node1.key.pri
        /certs/cert_1.cert
    volumes:
      - ./infra/resilientdb/server.config:/config/server.config:ro
      - resdb-1-data:/data
      - resdb-certs:/certs:ro
    networks:
      resdb-private:
        ipv4_address: 172.28.0.11

  resdb-2:
    <<: *resdb-common
    command:
      - >-
        exec /app/bazel-bin/service/kv/kv_service
        /config/server.config
        /certs/node2.key.pri
        /certs/cert_2.cert
    volumes:
      - ./infra/resilientdb/server.config:/config/server.config:ro
      - resdb-2-data:/data
      - resdb-certs:/certs:ro
    networks:
      resdb-private:
        ipv4_address: 172.28.0.12

  resdb-3:
    <<: *resdb-common
    command:
      - >-
        exec /app/bazel-bin/service/kv/kv_service
        /config/server.config
        /certs/node3.key.pri
        /certs/cert_3.cert
    volumes:
      - ./infra/resilientdb/server.config:/config/server.config:ro
      - resdb-3-data:/data
      - resdb-certs:/certs:ro
    networks:
      resdb-private:
        ipv4_address: 172.28.0.13

  resdb-4:
    <<: *resdb-common
    command:
      - >-
        exec /app/bazel-bin/service/kv/kv_service
        /config/server.config
        /certs/node4.key.pri
        /certs/cert_4.cert
    volumes:
      - ./infra/resilientdb/server.config:/config/server.config:ro
      - resdb-4-data:/data
      - resdb-certs:/certs:ro
    networks:
      resdb-private:
        ipv4_address: 172.28.0.14

  resdb-proxy:
    <<: *resdb-common
    command:
      - >-
        exec /app/bazel-bin/service/kv/kv_service
        /config/server.config
        /certs/node5.key.pri
        /certs/cert_5.cert
    volumes:
      - ./infra/resilientdb/server.config:/config/server.config:ro
      - resdb-certs:/certs:ro
    networks:
      resdb-private:
        ipv4_address: 172.28.0.10

  resdb-tools:
    <<: *resdb-common
    container_name: resfinance-resdb-tools
    profiles: ["tools"]
    command: ["tail -f /dev/null"]
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - ./infra/resilientdb/client.config:/config/client.config:ro
    networks:
      resdb-private:
        ipv4_address: 172.28.0.20
    depends_on:
      resdb-proxy:
        condition: service_healthy

  api:
    platform: linux/arm64
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    profiles: ["app"]
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app-public
      - resdb-private
    depends_on:
      resdb-1:
        condition: service_healthy
      resdb-2:
        condition: service_healthy
      resdb-3:
        condition: service_healthy
      resdb-4:
        condition: service_healthy
      resdb-proxy:
        condition: service_healthy
    environment:
      RESFINANCE_EVENT_KEY_FILE: /certs/finance-event.key
    volumes:
      - resdb-certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  app-public:
  resdb-private:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  resdb-certs:
  resdb-1-data:
  resdb-2-data:
  resdb-3-data:
  resdb-4-data:
